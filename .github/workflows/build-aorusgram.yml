name: Build AorusGram IPA

on:
  push:
    branches: [ main, "claude/**", "cursor/**" ]
  workflow_dispatch:

# Do not cancel in-progress Bazel runs: a new push or manual dispatch must not kill a 40–60m build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      # Quiets GitHub deprecation warnings for actions/cache, checkout, upload-artifact on Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_IOS_COMMIT: 6ad963e5b62d354da79040f388ae2b9132fb17b8
      TELEGRAM_IOS_VERSION: 12.9.2
      PILLOW_VERSION: 11.3.0
      LIBXRAY_VERSION: v26.7.28
      LIBXRAY_APPLE_SHA256: 07f7ed7697277930e1c517755855950f594f41435b0dfc5917a66eea6278aeb9
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: aorusgram

      - name: Release security preflight
        run: python3 aorusgram/scripts/release_security_check.py aorusgram

      - name: AorusAI transport and store preflight
        run: |
          mkdir -p /tmp/aorus-ai-preflight/module-cache
          swiftc \
            -module-cache-path /tmp/aorus-ai-preflight/module-cache \
            aorusgram/AorusGram/Sources/Features/AI/AorusAISSEParser.swift \
            aorusgram/scripts/tests/AorusAISSEParserTests.swift \
            -o /tmp/aorus-ai-preflight/sse-tests
          /tmp/aorus-ai-preflight/sse-tests
          swiftc \
            -module-cache-path /tmp/aorus-ai-preflight/module-cache \
            aorusgram/AorusGram/Sources/Features/AI/AorusAISSEParser.swift \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIModels.swift \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIArtifactFlow.swift \
            aorusgram/scripts/tests/AorusAIArtifactFlowTests.swift \
            -o /tmp/aorus-ai-preflight/artifact-tests
          /tmp/aorus-ai-preflight/artifact-tests
          swiftc -typecheck \
            -module-cache-path /tmp/aorus-ai-preflight/module-cache \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIModels.swift \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIArtifactFlow.swift \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIStore.swift
          swiftc -frontend -parse \
            aorusgram/AorusGram/Sources/Features/AI/AorusAIClient.swift
          swiftc -frontend -parse \
            aorusgram/patches/submodules/AorusGramUI/Sources/Features/AI/AorusAIControllers.swift
          swiftc -frontend -parse \
            aorusgram/patches/submodules/AorusGramUI/Sources/Features/AI/AorusAIDesign.swift
          swiftc -frontend -parse \
            aorusgram/patches/submodules/AorusGramUI/Sources/Features/AI/AorusAIDictation.swift

      # Cache only an immutable, unmodified upstream checkout. The working copy is
      # recreated below on every run, so build-time HMAC injection can never leak
      # into the cache or survive a secret rotation.
      - name: Cache pristine Telegram iOS source
        id: tg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: telegram-ios-pristine
          key: tg-ios-pristine-${{ runner.os }}-${{ env.TELEGRAM_IOS_COMMIT }}-v3

      - name: Clone pristine Telegram iOS
        if: steps.tg-cache.outputs.cache-hit != 'true'
        run: |
          git init telegram-ios-pristine
          cd telegram-ios-pristine
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth=1 origin "$TELEGRAM_IOS_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TELEGRAM_IOS_COMMIT"
          # Retry submodule fetch: a single --jobs=4 pass intermittently leaves a
          # submodule half-populated (e.g. webrtc missing experiments/field_trials.py),
          # which used to be silently swallowed by `|| true` and only surfaced as a
          # Bazel genrule "input file does not exist" failure much later. Retry a few
          # times so a transient network hiccup on one submodule self-heals.
          for attempt in 1 2 3; do
            echo "=== submodule update attempt $attempt ==="
            if git submodule update --init --force --depth=1 --jobs=4; then
              echo "submodule update succeeded"
              break
            fi
            echo "submodule update attempt $attempt failed; retrying..."
            sleep $((attempt * 4))
          done
          git submodule status --recursive | awk '$1 ~ /^[-+U]/ { bad=1 } END { exit bad }'

      - name: Create clean Telegram iOS working copy
        run: |
          test -d telegram-ios-pristine/.git
          test "$(git -C telegram-ios-pristine rev-parse HEAD)" = "$TELEGRAM_IOS_COMMIT"
          test -z "$(git -C telegram-ios-pristine status --porcelain --untracked-files=no)"
          git -C telegram-ios-pristine submodule status --recursive | awk '$1 ~ /^[-+U]/ { bad=1 } END { exit bad }'
          rm -rf telegram-ios
          cp -a telegram-ios-pristine telegram-ios
          test "$(git -C telegram-ios rev-parse HEAD)" = "$TELEGRAM_IOS_COMMIT"
          test "$(python3 -c 'import json; print(json.load(open("telegram-ios/versions.json"))["app"])')" = "$TELEGRAM_IOS_VERSION"

      - name: Ensure rlottie submodule
        run: |
          cd telegram-ios
          CPP_COUNT=$(find submodules/rlottie/rlottie/src -name "*.cpp" 2>/dev/null | wc -l)
          echo "rlottie .cpp files found: $CPP_COUNT"
          if [ "$CPP_COUNT" -eq 0 ]; then
            echo "FATAL: pinned rlottie submodule is incomplete"
            exit 1
          fi
          echo "rlottie .cpp count after: $(find submodules/rlottie/rlottie/src -name '*.cpp' | wc -l)"

      - name: Verify current MTProxy Fake-TLS fingerprint
        run: |
          python3 << 'PY'
          from pathlib import Path

          path = Path("telegram-ios/submodules/MtProtoKit/Sources/MTTcpConnection.m")
          if not path.is_file():
              raise SystemExit("MTTcpConnection.m is missing")
          text = path.read_text(encoding="utf-8")
          # Telegram's 2026-04-07 Safari ClientHello update removes the obsolete,
          # DPI-visible JA3/JA4 signature. Fail at the start of CI if the pinned
          # Telegram branch/cache ever regresses to the old generator.
          required = (
              "generate_ml_kem_public_key",
              "HelloGenerationCommandMlKemKey",
              "HelloGenerationCommandBeginChoice",
              "MTCreateSafariClientHello",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("MTProxy Fake-TLS fingerprint regression: " + ", ".join(missing))
          print("MTProxy Fake-TLS fingerprint: current Safari/ML-KEM generator verified")
          PY

      - name: Ensure webrtc submodule
        run: |
          cd telegram-ios
          # The WebRTC submodule feeds a Bazel genrule (generate_field_trials_header)
          # that reads webrtc/experiments/field_trials.py. If the submodule fetch left
          # the tree incomplete, that file is missing and the build dies with
          # "1 input file(s) do not exist" long before any Swift compiles. Guard it the
          # same way as rlottie: check for the sentinel file, re-fetch if absent.
          WEBRTC_DIR="third-party/webrtc/webrtc"
          SENTINEL="$WEBRTC_DIR/experiments/field_trials.py"
          if [ ! -f "$SENTINEL" ]; then
            echo "webrtc submodule incomplete (missing $SENTINEL) — re-fetching..."
            for attempt in 1 2 3; do
              echo "=== webrtc fetch attempt $attempt ==="
              if git submodule update --init --force --depth=1 "$WEBRTC_DIR"; then
                [ -f "$SENTINEL" ] && break
              fi
              echo "webrtc still incomplete; retrying..."
              sleep $((attempt * 4))
            done
          fi
          if [ ! -f "$SENTINEL" ]; then
            echo "webrtc submodule update did not restore sentinel — cloning directly..."
            WEBRTC_SHA=$(git ls-tree HEAD "$WEBRTC_DIR" 2>/dev/null | awk '{print $3}')
            rm -rf "$WEBRTC_DIR"
            git clone https://github.com/ali-fareed/webrtc.git "$WEBRTC_DIR"
            if [ -n "$WEBRTC_SHA" ]; then
              ( cd "$WEBRTC_DIR" && git checkout -q "$WEBRTC_SHA" ) || {
                echo "FATAL: could not check out pinned webrtc sha $WEBRTC_SHA"
                exit 1
              }
            else
              echo "FATAL: pinned webrtc sha is missing from the Telegram tree"
              exit 1
            fi
          fi
          if [ -f "$SENTINEL" ]; then
            echo "webrtc OK: $SENTINEL present"
          else
            echo "FATAL: webrtc field_trials.py still missing after all recovery attempts"
            exit 1
          fi

      # Cosmetic: a few upstream icons ship as sub-8-bit or 16-bit PNGs, which makes
      # CopyPng emit "Input PNG does not have an 8 bit input depth" warnings. Re-encode
      # just those known assets to 8-bit, mode-aware so pixels stay visually identical:
      # Transparency-bearing 1-bit/palette assets -> 8-bit RGBA; opaque grayscale ->
      # 8-bit L. Preserving the tRNS chunk is essential: crop corners and media-group
      # glyphs are masks, and converting them to plain L produces an opaque black box.
      - name: Normalize non-8-bit PNGs to 8-bit (silence libpng warnings)
        run: |
          cd telegram-ios
          PNG_VENV="$RUNNER_TEMP/aorus-png-venv"
          rm -rf "$PNG_VENV"
          python3 -m venv "$PNG_VENV"
          "$PNG_VENV/bin/python" -m pip install --quiet --disable-pip-version-check "Pillow==$PILLOW_VERSION"
          "$PNG_VENV/bin/python" << 'PYEOF'
          import os
          from PIL import Image
          names = {
              "VideoRecordArrow",
              "PhotoEditorCropCorners",
              "ModernMediaEmptyAlbumIcon",
              "MediaGroupBurst",
              "MediaGroupAll",
              "CameraFocusCrosshairs",
              "CameraAutoFocusCrosshairs",
          }

          def normalize_with_pillow(path):
              im = Image.open(path)
              has_transparency = "transparency" in im.info or "A" in im.getbands()
              if has_transparency:
                  im2 = im.convert("RGBA")
              elif im.mode == "1":
                  im2 = im.convert("L")
              elif im.mode == "P":
                  im2 = im.convert("RGB")
              elif im.mode in ("L", "LA", "RGB", "RGBA"):
                  im2 = im
              else:
                  im2 = im.convert("RGBA")
              im2.save(path, format="PNG", optimize=True)

          count = 0
          for root, _, files in os.walk("."):
              for fn in files:
                  if not fn.endswith(".png"):
                      continue
                  base = fn.split("@", 1)[0].rsplit(".", 1)[0]
                  if base not in names:
                      continue
                  p = os.path.join(root, fn)
                  try:
                      normalize_with_pillow(p)
                      count += 1
                      print("8-bit:", p)
                  except Exception as e:
                      print("skip", p, e)
          print("PNG normalization done, converted", count)
          PYEOF

      # Must run on every SDK: on iOS 26+ the "Fix Icon Composer" step is skipped and
      # these lines were never appended — Bazel then enables index-while-building (slow,
      # extra GitHub downloads) and can hit 502/timeouts during repo fetch.
      - name: Bazel CI tuning (.bazelrc, always)
        run: |
          BC=telegram-ios/.bazelrc
          touch "$BC"
          add() { grep -qxF "$1" "$BC" 2>/dev/null || echo "$1" >> "$BC"; }
          add "build --incompatible_disallow_empty_glob=false"
          # Quiets Bazel 8 MODULE.bazel vs resolved graph mismatch (bazel_features / skylib / platforms).
          add "build --check_direct_dependencies=off"
          add "build --features=-swift.index_while_building"
          add "build --features=-swift.use_global_index_store"
          # Device IPA without Apple identity: Telegram vendors rules_apple with disable_legacy_signing
          # (skips legacy codesign path that requires a cert matching the .mobileprovision).
          add "build --features=disable_legacy_signing"
          echo "=== tail $BC ==="; tail -5 "$BC"

      - name: Patch Telegram/BUILD bundle IDs to AorusGram
        run: |
          python3 << 'PYEOF'
          import os

          # Replacements — order matters: specific suffixes before the base ID
          replacements = [
              ('ph.telegra.Telegraph.Share',                   'com.aorusgram.Share'),
              ('ph.telegra.Telegraph.SiriIntents',             'com.aorusgram.SiriIntents'),
              ('ph.telegra.Telegraph.Widget',                  'com.aorusgram.Widget'),
              ('ph.telegra.Telegraph.BroadcastUpload',         'com.aorusgram.BroadcastUpload'),
              ('ph.telegra.Telegraph.NotificationServiceExtension', 'com.aorusgram.NotificationService'),
              ('ph.telegra.Telegraph.NotificationService',     'com.aorusgram.NotificationService'),
              ('ph.telegra.Telegraph.NotificationContent',     'com.aorusgram.NotificationContent'),
              ('ph.telegra.Telegraph.WatchkitApp',             'com.aorusgram.watchkitapp'),
              ('ph.telegra.Telegraph.WatchkitExtension',       'com.aorusgram.watchkitapp.watchkitextension'),
              ('ph.telegra.Telegraph.SiriIntentsUI',           'com.aorusgram.SiriIntentsUI'),
              ('ph.telegra.Telegraph',                         'com.aorusgram'),
              ('C67CF9S4VU',                                   'R9Q5YYQM2M'),
          ]

          # 1. Patch Telegram/BUILD
          build_path = 'telegram-ios/Telegram/BUILD'
          if os.path.exists(build_path):
              t = open(build_path).read()
              for old, new in replacements:
                  n = t.count(old)
                  if n:
                      t = t.replace(old, new)
                      print(f'BUILD: replaced {n}x "{old}"')
              # After replacing bundle IDs, store_bundle_ids now contains our ID,
              # which triggers com.apple.developer.applesignin entitlement.
              # Clear the list so none of the App-Store-only entitlements are added.
              import re as _re
              t = _re.sub(r'store_bundle_ids\s*=\s*\[.*?\]', 'store_bundle_ids = []', t, flags=_re.DOTALL)
              # Also clear official_bundle_ids to skip VoIP/CarPlay/associated-domains
              t = _re.sub(r'official_bundle_ids\s*=\s*\[.*?\]', 'official_bundle_ids = []', t, flags=_re.DOTALL)
              # Device + --disableProvisioningProfiles: every select() used None for this branch.
              # rules_apple fails if ANY built target still resolves to None. count=1 only fixed the
              # first match (an extension), not //Telegram:Telegram — replace all branches.
              t2, nprov = _re.subn(
                  r'(":disableProvisioningProfilesSetting"\s*:\s*)None(\s*,)',
                  r'\1"@build_configuration//provisioning:Telegram.mobileprovision"\2',
                  t,
              )
              if nprov:
                  t = t2
                  print(f'BUILD: disableProvisioningProfiles → Telegram.mobileprovision ({nprov} branches)')
              # Bazel merges plist_fragment() templates from this file — on-disk Info.plist is NOT enough.
              build_brand = [
                  (
                      '<key>CFBundleDisplayName</key>\n    <string>Telegram</string>',
                      '<key>CFBundleDisplayName</key>\n    <string>Aorusgram</string>',
                  ),
                  (
                      '<key>CFBundleName</key>\n    <string>Telegram</string>',
                      '<key>CFBundleName</key>\n    <string>Aorusgram</string>',
                  ),
                  (
                      '<key>CFBundleURLSchemes</key>\n            <array>\n                <string>telegram</string>\n            </array>',
                      '<key>CFBundleURLSchemes</key>\n            <array>\n                <string>aorusgram</string>\n            </array>',
                  ),
              ]
              for old_b, new_b in build_brand:
                  n = t.count(old_b)
                  if n:
                      t = t.replace(old_b, new_b)
                      print(f'BUILD branding: replaced {n}x', old_b.split()[0:2])
                  else:
                      print('WARNING: BUILD branding pattern missing:', old_b[:70].replace('\n', ' '))
              open(build_path, 'w').write(t)
              print('BUILD file patched: store_bundle_ids and official_bundle_ids cleared')
          else:
              print('WARNING: Telegram/BUILD not found')

          # 2. Patch all *.entitlements files in telegram-ios/Telegram/
          ent_dir = 'telegram-ios/Telegram'
          if os.path.isdir(ent_dir):
              for fname in sorted(os.listdir(ent_dir)):
                  if fname.endswith('.entitlements'):
                      fpath = os.path.join(ent_dir, fname)
                      t2 = open(fpath).read()
                      changed = False
                      for old, new in replacements:
                          if old in t2:
                              t2 = t2.replace(old, new)
                              changed = True
                      if changed:
                          open(fpath, 'w').write(t2)
                          print(f'Entitlements patched: {fname}')
          PYEOF

      - name: Setup Xcode (newest available, prefer iOS 26 SDK)
        id: xcode_setup
        run: |
          echo "=== All installed Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(no Xcode_*.app found, only default)"

          # Pick the newest Xcode by version. Order: 26 > 17 > 16 > fallback.
          XCODE=""
          for cand in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V -r); do
            XCODE="$cand"; break
          done
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then
            XCODE=/Applications/Xcode.app
          fi
          if [ -z "$XCODE" ]; then
            echo "FATAL: no Xcode installation found"
            exit 1
          fi

          echo "Selected Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

          echo "=== iOS SDKs ==="
          xcodebuild -showsdks 2>/dev/null | grep -iE "iphoneos|ios" || true

          # Detect iOS SDK major version to gate compatibility patches.
          IOS_SDK=$(xcodebuild -showsdks 2>/dev/null | grep -oE 'iphoneos[0-9]+' | sort -V | tail -1 | grep -oE '[0-9]+')
          if [ -z "$IOS_SDK" ]; then IOS_SDK=0; fi
          echo "Detected iOS SDK major: $IOS_SDK"
          echo "ios_sdk_major=$IOS_SDK" >> "$GITHUB_OUTPUT"

          # Detect Swift compiler version
          SWIFT_VER=$(swift --version 2>/dev/null | grep -oE 'Swift version [0-9]+\.[0-9]+' | head -1 | awk '{print $3}')
          echo "Swift compiler: $SWIFT_VER"
          echo "swift_version=$SWIFT_VER" >> "$GITHUB_OUTPUT"

      - name: Fix Icon Composer bundles (only if SDK < iOS 26)
        if: ${{ steps.xcode_setup.outputs.ios_sdk_major < 26 }}
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode())"

      - name: Patch SDK compatibility (only if SDK < iOS 26)
        if: ${{ steps.xcode_setup.outputs.ios_sdk_major < 26 }}
        run: |
          python3 << 'SDKEOF'
          import re, os, glob

          def patch_file(path, fn):
              if not os.path.exists(path):
                  print(f'Not found: {path}'); return
              try:
                  c = open(path, encoding='utf-8', errors='ignore').read()
                  n = fn(c)
                  if n != c:
                      open(path, 'w', encoding='utf-8').write(n)
                      print(f'Patched: {path}')
              except Exception as e:
                  print(f'Error {path}: {e}')

          # Detect Swift compiler version (Xcode 16 = Swift 6.0+)
          # We use #if compiler(>=6.0) as the gate. iOS 26 (UIGlassEffect,
          # WindowingControlStyle) is NOT in any released Xcode yet — keep stubs
          # for compiler < 6.2; the runtime #available guards still work on iOS 26 devices.

          # ── 1. NativeWindowHostView.swift — iOS 26 WindowingControlStyle ──────
          # Xcode 16 (compiler 6.0) does NOT have iOS 26 SDK either. Wrap with
          # #if compiler(>=6.2) so it compiles on Xcode 16, runtime-guards on iOS 26.
          def fix_nativewindow(c):
              if 'WindowingControlStyle' not in c: return c
              lines = c.split('\n'); result = []; i = 0; n = 0
              while i < len(lines):
                  ln = lines[i]
                  if ('@available(iOS 26' in ln and i+1 < len(lines) and
                      'func ' in lines[i+1] and 'WindowingControlStyle' in lines[i+1]):
                      sp = ' ' * (len(ln) - len(ln.lstrip()))
                      result.append(sp + '#if compiler(>=6.2)')
                      result.append(ln); result.append(lines[i+1])
                      depth = lines[i+1].count('{') - lines[i+1].count('}'); i += 2
                      while i < len(lines) and depth > 0:
                          result.append(lines[i])
                          depth += lines[i].count('{') - lines[i].count('}'); i += 1
                      result.append(sp + '#endif'); n += 1
                  else:
                      result.append(ln); i += 1
              if n: print(f'NativeWindowHostView: {n} iOS 26 block(s) wrapped')
              return '\n'.join(result)

          patch_file('telegram-ios/submodules/Display/Source/NativeWindowHostView.swift', fix_nativewindow)

          # ── 2. GlassBackgroundComponent.swift — iOS 26 UIGlassEffect ──────────
          # Stub the iOS 26 types when compiler doesn't have them.
          def fix_glass(c):
              stub = """#if !compiler(>=6.2)
          @available(iOS 26.0, *)
          class UIGlassEffect: UIVisualEffect {
              enum Style { case regular, clear }
              convenience init(style: Style) { self.init() }
              var tintColor: UIColor?
              var isInteractive: Bool = false
          }
          @available(iOS 26.0, *)
          class UIGlassContainerEffect: UIVisualEffect {
              var spacing: CGFloat = 0.0
          }
          #endif
          """
              if 'UIGlassEffect' in c and '#if !compiler(>=6.2)' not in c:
                  # Remove any old #if !compiler(>=6.0) stubs
                  c = re.sub(r'#if !compiler\(>=6\.0\)\n.*?#endif\n', '', c, flags=re.DOTALL)
                  lines = c.split('\n'); ins = 0
                  for j, ln in enumerate(lines):
                      if ln.strip().startswith('import ') or ln.strip() == '': ins = j+1
                      elif ins > 0: break
                  lines.insert(ins, stub); c = '\n'.join(lines)
                  print('GlassBackgroundComponent: UIGlassEffect stub inserted (compiler<6.2)')
              return c

          patch_file('telegram-ios/submodules/TelegramUI/Components/GlassBackgroundComponent/Sources/GlassBackgroundComponent.swift', fix_glass)

          print('=== Done. Xcode 16 + iOS 18 SDK handles NSAdaptiveImageGlyph, .limited, supportsAdaptiveImageGlyph, trackConfiguration natively. ===')
          SDKEOF

      - name: Inject AorusGram sources
        run: |
          PATCHES=aorusgram/patches
          TG=telegram-ios
          PEER=$TG/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen

          # 0. AorusGram core (ClientSpoofManager, AorusGramBootstrap, etc.) — must link into TelegramUI
          mkdir -p $TG/submodules/AorusGram
          rm -rf $TG/submodules/AorusGram/Sources
          rm -rf $TG/submodules/AorusGram/Resources
          cp -a aorusgram/AorusGram/Sources $TG/submodules/AorusGram/
          cp -a aorusgram/AorusGram/Resources $TG/submodules/AorusGram/
          cp $PATCHES/submodules/AorusGram/BUILD $TG/submodules/AorusGram/
          python3 << 'PY'
          from pathlib import Path
          p = Path("telegram-ios/submodules/TelegramUI/BUILD")
          t = p.read_text()
          needle = '        "//submodules/TelegramUIPreferences:TelegramUIPreferences",\n'
          if needle not in t:
              raise SystemExit("TelegramUI BUILD: needle for AorusGram insert not found")
          deps = [
              ('//submodules/AorusGram:AorusGram', '        "//submodules/AorusGram:AorusGram",\n'),
              ('//submodules/AorusGramUI:AorusGramUI', '        "//submodules/AorusGramUI:AorusGramUI",\n'),
          ]
          insert = ""
          for label, dep in deps:
              if label in t:
                  print(f"TelegramUI BUILD: {label} dep already present")
              else:
                  insert += dep
                  print(f"TelegramUI BUILD: added {label}")
          if insert:
              t = t.replace(needle, needle + insert, 1)
              p.write_text(t)
          PY

          # 1. Copy AorusGramUI module (all new code, no conflicts)
          # Wipe the tree first: cached telegram-ios may still contain renamed/removed Swift
          # files; plain cp -r merges and leaves stale basenames → Bazel "filename used twice".
          rm -rf $TG/submodules/AorusGramUI
          mkdir -p $TG/submodules/AorusGramUI
          cp -r $PATCHES/submodules/AorusGramUI/. $TG/submodules/AorusGramUI/

          # 1b. Copy AorusBadge module (local verification/DEV/meme badge system)
          rm -rf $TG/submodules/AorusBadge
          mkdir -p $TG/submodules/AorusBadge
          cp -r $PATCHES/submodules/AorusBadge/. $TG/submodules/AorusBadge/

          # 1c. Copy AorusMaskPicker module (mask strip shown inside calls and round videos).
          # Leaf module, UIKit only: the call screen sits far below AorusGramUI and must not
          # depend on the settings UI just to draw a row of thumbnails.
          rm -rf $TG/submodules/AorusMaskPicker
          mkdir -p $TG/submodules/AorusMaskPicker
          cp -r $PATCHES/submodules/AorusMaskPicker/. $TG/submodules/AorusMaskPicker/

          # 2. Add AorusGramUI dep to the REAL PeerInfoScreen BUILD in place.
          #    (Do NOT overwrite with a stale full copy — upstream drifts, e.g. it
          #    removed WebSearchUI, which broke analysis when our copy still listed it.)
          python3 -c "import base64; exec(base64.b64decode('').decode())"

          # 3. Add the AorusGram Settings disclosure item to the REAL upstream
          #    PeerInfoSettingsItems.swift in place. (Do NOT overwrite with a stale
          #    full copy — upstream drifts: 12.8 changed RenderedPeer -> EngineRenderedPeer
          #    in this file, which broke our snapshot copy. In-place patching tracks upstream.)
          python3 << 'PY'
          import sys
          from pathlib import Path
          p = Path("telegram-ios/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift")
          if not p.is_file():
              sys.exit("PeerInfoSettingsItems.swift not found")
          t = p.read_text(encoding="utf-8")

          # 3a. Dedicated section for AorusGram, placed immediately after the myProfile
          #     case so it renders as its OWN block directly under the "My Profile" block.
          if "case aorusGram" not in t:
              enum_anchor = "    case myProfile\n"
              if enum_anchor not in t:
                  sys.exit("PeerInfoSettingsItems: myProfile enum case not found")
              t = t.replace(enum_anchor, enum_anchor + "    case aorusGram\n", 1)
              print("PeerInfoSettingsItems: added aorusGram section after myProfile")

          # 3b. A single "AorusGram" row in that section. Icon = white gear on a blue
          #     rounded square, rendered by Telegram's own settings-icon helper (identical
          #     look to native rows like Notifications/Privacy, matching the reference photo).
          if "interaction.openSettings(.aorusGram)" not in t:
              anchor = "items[.support]!.append(PeerInfoScreenDisclosureItem(id: 0, text: presentationData.strings.Settings_Support,"
              idx = t.find(anchor)
              if idx == -1:
                  sys.exit("PeerInfoSettingsItems: Settings_Support anchor not found")
              line_start = t.rfind("\n", 0, idx) + 1
              indent = t[line_start:idx]
              block = (
                  indent + "let aorusRowIcon: UIImage? = {\n"
                  + indent + "    // AorusGram brand icon (white A on black), embedded as base64 and drawn into a rounded\n"
                  + indent + "    // 30x30 settings tile (always the black icon, independent of theme).\n"
                  + indent + "    let aorusIconB64 = \"\"\n"
                  + indent + "    guard let aorusIconData = Data(base64Encoded: aorusIconB64), let base = UIImage(data: aorusIconData) else { return nil }\n"
                  + indent + "    let sz = CGSize(width: 30.0, height: 30.0)\n"
                  + indent + "    return UIGraphicsImageRenderer(size: sz).image { _ in\n"
                  + indent + "        UIBezierPath(roundedRect: CGRect(origin: .zero, size: sz), cornerRadius: 8.0).addClip()\n"
                  + indent + "        base.draw(in: CGRect(origin: .zero, size: sz))\n"
                  + indent + "    }\n"
                  + indent + "}()\n"
                  + indent + "items[.aorusGram]!.append(PeerInfoScreenDisclosureItem(id: 0, text: \"AorusGram\", icon: aorusRowIcon, action: {\n"
                  + indent + "    interaction.openSettings(.aorusGram)\n"
                  + indent + "}))\n"
              )
              t = t[:line_start] + block + t[line_start:]
              print("PeerInfoSettingsItems: inserted AorusGram row in its own section under My Profile")
          else:
              print("PeerInfoSettingsItems: AorusGram item already present")

          p.write_text(t, encoding="utf-8")
          PY

          # 4. Patch PeerInfoScreen.swift in-place (add case aorusGram to enum)
          # 5. Patch PeerInfoScreenSettingsActions.swift in-place (add import + case)
          python3 -c "import base64; exec(base64.b64decode('').decode())"

          # 6. Copy the AorusGram conversation-export helper into the PeerInfoScreen
          #    module (compiled via the module's Sources/**/*.swift glob; the "Download
          #    conversation" menu item is injected into PeerInfoScreenPerformButtonAction
          #    by aorus_branding.py).
          cp $PATCHES/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/AorusConversationExport.swift $PEER/Sources/

          # 7. Copy the AorusGram "user's messages in group" chat-contents helper into the
          #    TelegramUI module (Sources/**/*.swift glob). The context-menu item and the
          #    single "Go to message" action are injected by aorus_branding.py.
          cp $PATCHES/submodules/TelegramUI/Sources/AorusUserMessages.swift $TG/submodules/TelegramUI/Sources/
          cp $PATCHES/submodules/TelegramUI/Sources/AorusWall.swift $TG/submodules/TelegramUI/Sources/

          # 8. Copy the AorusGram SOCKS5 call-proxy reader into TelegramCallsUI (the
          #    call-start sites are patched to use it by aorus_branding.py).
          cp $PATCHES/submodules/TelegramCallsUI/Sources/AorusCallProxy.swift $TG/submodules/TelegramCallsUI/Sources/

          # 9. Copy the mini-app tunnel helpers into WebUI (Sources/**/*.swift glob). A
          #    WKWebView has its own network stack and ignores the proxy TelegramCore uses,
          #    so the web view configuration and the load gate are patched to use these by
          #    aorus_branding.py. AorusWebTunnelStrings.swift is generated by
          #    scripts/gen_module_strings.py from the main phrase book.
          cp $PATCHES/submodules/WebUI/Sources/AorusWebTunnel.swift $TG/submodules/WebUI/Sources/
          cp $PATCHES/submodules/WebUI/Sources/AorusWebTunnelStrings.swift $TG/submodules/WebUI/Sources/

          # 10. Copy the tunnel-aware connection title helper into ChatListUI (Sources/**/*.swift
          #     glob). Both ".connecting" title sites are patched to use it by aorus_branding.py.
          #     AorusConnectionStrings.swift is generated by scripts/gen_module_strings.py.
          cp $PATCHES/submodules/ChatListUI/Sources/AorusConnectionStatus.swift $TG/submodules/ChatListUI/Sources/
          cp $PATCHES/submodules/ChatListUI/Sources/AorusConnectionStrings.swift $TG/submodules/ChatListUI/Sources/

          # 11. Copy the search-by-Telegram-ID helper into ChatListUI. The search pane is
          #     patched to merge its results into the local section by aorus_branding.py.
          cp $PATCHES/submodules/ChatListUI/Sources/AorusPeerIdSearch.swift $TG/submodules/ChatListUI/Sources/

          # 12. Copy the auto-formatting store into TextFormat. Entity generation is patched
          #     to apply the configured base style by aorus_branding.py.
          cp $PATCHES/submodules/TextFormat/Sources/AorusAutoFormat.swift $TG/submodules/TextFormat/Sources/

          # 13. Copy the live composer half of the same feature into ChatInputTextNode. The
          #     per-keystroke decoration pass is patched to call it by aorus_branding.py.
          cp $PATCHES/submodules/TelegramUI/Components/Chat/ChatInputTextNode/Sources/AorusBaseStyle.swift \
             $TG/submodules/TelegramUI/Components/Chat/ChatInputTextNode/Sources/

          # 9. Copy the login-by-backup account picker into AuthorizationUI (compiled via
          #    its Sources/**/*.swift glob). The themed key button on the phone-entry
          #    screen that presents it is injected by aorus_branding.py.
          cp $PATCHES/submodules/AuthorizationUI/Sources/AorusLoginBackupPicker.swift $TG/submodules/AuthorizationUI/Sources/

          # 10. Copy the Formatting Panel SwiftUI toolbar into the chat input panel module
          #     (compiled via its Sources/**/*.swift glob). The toolbar is wired into the
          #     input panel node by aorus_branding.py.
          cp $PATCHES/submodules/TelegramUI/Components/Chat/ChatTextInputPanelNode/Sources/AorusInputToolbar.swift $TG/submodules/TelegramUI/Components/Chat/ChatTextInputPanelNode/Sources/

          echo "Injection complete"
          echo "--- AorusGramUI sources ---"
          ls -la $TG/submodules/AorusGramUI/Sources/

      - name: Stage pinned official libXray XCFramework
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/libxray-apple-cgo.zip"
          EXTRACTED="$RUNNER_TEMP/libxray-apple-cgo"
          TARGET="telegram-ios/submodules/AorusGram/ThirdParty/LibXray.xcframework"
          URL="https://github.com/XTLS/libXray/releases/download/${LIBXRAY_VERSION}/libxray-apple-cgo.zip"

          curl --fail --location --retry 4 --retry-all-errors --output "$ARCHIVE" "$URL"
          echo "${LIBXRAY_APPLE_SHA256}  ${ARCHIVE}" | shasum -a 256 --check
          rm -rf "$EXTRACTED" "$TARGET"
          mkdir -p "$EXTRACTED" "$(dirname "$TARGET")"
          ditto -x -k "$ARCHIVE" "$EXTRACTED"
          SOURCE=$(find "$EXTRACTED" -type d -name LibXray.xcframework -print -quit)
          test -n "$SOURCE"
          ditto "$SOURCE" "$TARGET"
          test -f "$TARGET/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AvailableLibraries' "$TARGET/Info.plist"
          find "$TARGET" -type f -name '*.a' -print

      - name: AorusGram branding (launch screen, name, URLs, icons, strings)
        env:
          # License HMAC key — injected (obfuscated) into LicenseKeyProvider.swift
          # at build time. The branding step fails closed if this secret is absent
          # or malformed, preventing an accidentally unlicensed production build.
          LICENSE_HMAC_KEY_HEX: ${{ secrets.LICENSE_HMAC_KEY_HEX }}
          # Separate rotatable request key for https://api.aorusgram.com/getProxy.
          PROXY_HMAC_KEY_HEX: ${{ secrets.PROXY_HMAC_KEY_HEX }}
        run: |
          python3 aorusgram/scripts/aorus_branding.py telegram-ios
          python3 aorusgram/scripts/aorus_ai_integration.py telegram-ios
          # Cached telegram-ios trees can carry AppDelegate edits without a matching import line.
          python3 << 'PY'
          import sys
          from pathlib import Path
          p = Path("telegram-ios/submodules/TelegramUI/Sources/AppDelegate.swift")
          if not p.is_file():
              sys.exit("AppDelegate.swift missing")
          t = p.read_text(encoding="utf-8")
          if "import AorusGram" in t:
              print("AppDelegate: import AorusGram already present")
              sys.exit(0)
          if "AorusGramBootstrap" not in t and "ClientSpoofManager" not in t:
              print("AppDelegate: no AorusGram hooks — skip import")
              sys.exit(0)
          pos = t.find("import UIKit")
          if pos < 0:
              sys.exit("AppDelegate: import UIKit not found")
          line_end = t.find("\n", pos)
          if line_end < 0:
              sys.exit("AppDelegate: newline after UIKit import not found")
          t = t[: line_end + 1] + "import AorusGram\n" + t[line_end + 1 :]
          p.write_text(t, encoding="utf-8")
          print("AppDelegate: forced import AorusGram (post-branding)")
          PY
          # Alternate icons are handled by patch_alternate_icons() in aorus_branding.py.
          # Belt-and-suspenders (xcconfig APP_NAME + explicit plist literals)
          PLIST="telegram-ios/Telegram/Telegram-iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Aorusgram" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Aorusgram" "$PLIST" 2>/dev/null || true
          python3 aorusgram/scripts/verify_aorus_branding.py telegram-ios

      - name: Install Bazel
        run: brew install bazel 2>/dev/null || true

      - name: Prepare build config
        working-directory: telegram-ios
        run: |
          echo "=== build-system contents ==="
          ls build-system/ || echo "(no build-system dir)"
          ls build-system/Make/ 2>/dev/null | head -20 || echo "(no Make dir)"
          echo "=== Writing AorusGram appstore-configuration.json (always overwrite) ==="
          python3 << 'CFEOF'
          import json
          api_id = "34110820"
          api_hash = "a000c631534567d489462ac9c72b7c4d"
          config = {
              "bundle_id": "com.aorusgram",
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": "R9Q5YYQM2M",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "aorusgram",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False
          }
          open('build-system/appstore-configuration.json', 'w').write(json.dumps(config, indent=2))
          print('Config written:')
          print(json.dumps(config, indent=2))
          CFEOF
          python3 << 'MPEOF'
          import os, shutil

          p = 'build-system/Make/Make.py'
          t = open(p).read()

          # 1. Inject provisioning profiles copy before invoke_build()
          inj = (
              "\n"
              "    import shutil as _sh, os as _os\n"
              "    _ps = _os.environ.get('RUNNER_TEMP', '/tmp') + '/signing/profiles'\n"
              "    _pd = _os.path.join(_os.getcwd(), 'build-input/configuration-repository/provisioning')\n"
              "    _os.makedirs(_pd, exist_ok=True)\n"
              "    _os.path.isdir(_ps) and [_sh.copy(_os.path.join(_ps,_f),_pd) for _f in _os.listdir(_ps) if _f.endswith('.mobileprovision')]\n"
              "    _fl = sorted(f for f in _os.listdir(_pd) if f.endswith('.mobileprovision'))\n"
              "    open(_os.path.join(_pd,'BUILD'),'w').write('exports_files([' + ','.join('\"'+f+'\"' for f in _fl) + '])')\n"
              "    print('Provisioning:', _fl)\n"
          )

          OLD = '    bazel_command_line.invoke_build()'
          if OLD in t:
              t = t.replace(OLD, inj + OLD, 1)
              print('Patched: invoke_build injection OK')
          else:
              print('WARNING: invoke_build not found')

          # 2. Unsigned device IPA — inject Bazel flags into BazelCommandLine.__init__ so every
          #    `bazel build` sees them. (A second replace on invoke_build() was fragile: upstream
          #    line numbers / duplicate matches could skip appending — CI then omitted
          #    disable_legacy_signing while still adding disableExtensions.)
          # Upstream Make.py gained extra comments after common_args = [ — match only the opener.
          ca_opener = "        self.common_args = [\n"
          ca_flags = (
              "            # CI: unsigned iphoneos artifact (rules_apple disable_legacy_signing).\n"
              "            '--features=disable_legacy_signing',\n"
              "            '--//Telegram:disableExtensions',\n"
              "            '--//Telegram:disableProvisioningProfiles',\n"
          )
          if "disable_legacy_signing" in t and "'--//Telegram:disableExtensions'" in t:
              print('Make.py: CI signing flags already present')
          elif ca_opener in t:
              t = t.replace(ca_opener, ca_opener + ca_flags, 1)
              print('Patched: common_args CI signing flags OK')
          else:
              print('WARNING: common_args opener not found — disable_legacy_signing not injected')

          # 3. Skip aps_environment None check (our fake profiles have it)
          t = t.replace('if codesigning_data.aps_environment is None:', 'if False and codesigning_data.aps_environment is None:', 1)
          t = t.replace("aps_environment=codesigning_data.aps_environment,", "aps_environment=codesigning_data.aps_environment or 'development',", 1)

          # 4. Drop dSYM generation from the release build. dsymutil on the full opt
          #    binary is the single biggest memory consumer at the final link step and
          #    was OOM-crashing bazel on the ~7 GB runner. dSYMs are debug-symbol files
          #    used only to symbolicate crash logs — they have ZERO effect on the app
          #    itself or its functionality, and are not needed for a sideload IPA.
          for _dsym_flag in ("'--apple_generate_dsym',", "'--output_groups=+dsyms',"):
              if _dsym_flag in t:
                  t = t.replace(_dsym_flag, "")
                  print('Make.py: removed dSYM flag', _dsym_flag)
              else:
                  print('Make.py: dSYM flag already absent', _dsym_flag)

          open(p, 'w').write(t)
          print('All Make.py patches applied')
          MPEOF

      - name: Fail fast — verify Make.py patches (saves ~1h if patch breaks)
        working-directory: telegram-ios
        run: |
          python3 << 'VERIFY'
          t = open("build-system/Make/Make.py", encoding="utf-8", errors="replace").read()
          assert "'--features=disable_legacy_signing'," in t, \
              "Make.py: disable_legacy_signing not in common_args"
          assert "'--//Telegram:disableExtensions'," in t, \
              "Make.py: disableExtensions not in common_args"
          assert "'--//Telegram:disableProvisioningProfiles'," in t, \
              "Make.py: disableProvisioningProfiles not in common_args"
          assert "_ps = _os.environ.get('RUNNER_TEMP'" in t, \
              "Make.py: missing provisioning copy injection"
          assert "if self.disable_provisioning_profiles:" in t, \
              "Make.py: invoke_build missing disable_provisioning_profiles branch"
          print("Make.py patch sanity checks: OK")
          VERIFY

      - name: Prepare codesigning
        run: |
          mkdir -p $RUNNER_TEMP/signing/profiles
          python3 << 'CSEOF'
          import subprocess, plistlib, uuid, os
          from datetime import datetime, timezone

          subprocess.run(
              ['openssl', 'req', '-x509', '-newkey', 'rsa:2048',
               '-keyout', '/tmp/fake-key.pem', '-out', '/tmp/fake-cert.pem',
               '-days', '3650', '-nodes', '-subj', '/CN=FakeProvision'],
              capture_output=True
          )
          cert_der = subprocess.check_output(
              ['openssl', 'x509', '-in', '/tmp/fake-cert.pem', '-outform', 'DER']
          )

          team = 'R9Q5YYQM2M'
          base = 'com.aorusgram'
          out_dir = os.environ.get('RUNNER_TEMP', '/tmp') + '/signing/profiles'
          os.makedirs(out_dir, exist_ok=True)

          # Bundle suffixes match the Telegram/BUILD template patterns exactly.
          # IntentsExtension uses .SiriIntents (BUILD: {telegram_bundle_id}.SiriIntents).
          # Watch uses .watchkitapp / .watchkitapp.watchkitextension.
          profiles = [
              ('Telegram',             base),
              ('Share',                base + '.Share'),
              ('NotificationService',  base + '.NotificationService'),
              ('NotificationContent',  base + '.NotificationContent'),
              ('Intents',              base + '.SiriIntents'),
              ('IntentsExtension',     base + '.SiriIntents'),
              # BUILD maps ph.telegra.Telegraph.SiriIntentsUI → com.aorusgram.SiriIntentsUI (not .IntentsUI).
              ('IntentsUIExtension',   base + '.SiriIntentsUI'),
              ('Widget',               base + '.Widget'),
              ('BroadcastUpload',      base + '.BroadcastUpload'),
              ('Watch',                base + '.watchkitapp'),
              ('WatchExtension',       base + '.watchkitapp.watchkitextension'),
          ]

          for name, bundle_suffix in profiles:
              entitlements = {
                  'application-identifier': team + '.' + bundle_suffix,
                  'aps-environment': 'development',
                  'keychain-access-groups': [team + '.' + bundle_suffix, team + '.' + base],
                  'com.apple.developer.team-identifier': team,
                  # plisttool checks ALL entitlement keys in the generated
                  # entitlements file against the provisioning profile.
                  # The Telegram BUILD template includes app-groups for all targets.
                  'com.apple.security.application-groups': ['group.' + base],
              }
              plist = {
                  'AppIDName': 'AorusGram',
                  'ApplicationIdentifierPrefix': [team],
                  'CreationDate': datetime(2025, 1, 1, tzinfo=timezone.utc),
                  'DeveloperCertificates': [cert_der],
                  'ExpirationDate': datetime(2030, 1, 1, tzinfo=timezone.utc),
                  'IsXcodeManaged': False,
                  'Name': 'AorusGram ' + name,
                  'ProvisionsAllDevices': True,
                  'TeamIdentifier': [team],
                  'TeamName': 'AorusGram Team',
                  'TimeToLive': 1826,
                  'UUID': str(uuid.uuid4()),
                  'Version': 1,
                  'Platform': ['iOS'],
                  'Entitlements': entitlements
              }
              plist_bytes = plistlib.dumps(plist, fmt=plistlib.FMT_XML)
              tmp_plist = '/tmp/pp-' + name + '.plist'
              open(tmp_plist, 'wb').write(plist_bytes)
              out_path = out_dir + '/' + name + '.mobileprovision'
              r = subprocess.run(
                  ['openssl', 'smime', '-sign', '-in', tmp_plist,
                   '-signer', '/tmp/fake-cert.pem', '-inkey', '/tmp/fake-key.pem',
                   '-outform', 'DER', '-nodetach', '-out', out_path],
                  capture_output=True
              )
              print(('Created: ' if r.returncode == 0 else 'Error: ') + name + '.mobileprovision')

          print('Profiles done')
          for f in sorted(os.listdir(out_dir)):
              print('  ', f, os.path.getsize(os.path.join(out_dir, f)), 'bytes')
          CSEOF

          # Optional keychain with fake PEM (harmless; main signing uses disable_legacy_signing).
          KEYCHAIN=/tmp/aorus-build.keychain-db
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p aorusbuild "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p aorusbuild "$KEYCHAIN"
          security import /tmp/fake-cert.pem -A -k "$KEYCHAIN" 2>/dev/null || true
          security import /tmp/fake-key.pem  -A -k "$KEYCHAIN" 2>/dev/null || true
          security list-keychain -d user -s "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || \
            security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k aorusbuild "$KEYCHAIN" 2>/dev/null || true
          echo "=== Signing identities (informational) ==="
          security find-identity -v -p codesigning "$KEYCHAIN" 2>/dev/null || true

      - name: Build release_arm64 (device, no extensions; unsigned via disable_legacy_signing)
        working-directory: telegram-ios
        run: |
          echo "=== Python version ==="
          python3 --version
          echo "=== release_arm64 (iphoneos) + disable_legacy_signing — CI artifact without Apple cert match ==="
          set -o pipefail
          # PIPESTATUS[0] is Make.py — tail must not mask a failed build (last pipe cmd would be 0).
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir ~/tg-bazel-cache \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath $RUNNER_TEMP/signing \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath $RUNNER_TEMP/artifacts \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -100
          exit "${PIPESTATUS[0]}"

      - name: Show compile errors
        if: always()
        run: |
          echo "=== First 80 lines ==="
          head -80 $RUNNER_TEMP/build.log 2>/dev/null || echo "(log not available)"
          echo "=== Errors (compiler + Bazel) ==="
          grep -iE " error:|^ERROR:|FAILED:" $RUNNER_TEMP/build.log | head -120 || echo "(none)"
          echo "=== Last 80 lines ==="
          tail -80 $RUNNER_TEMP/build.log 2>/dev/null || echo "(log not available)"

      - name: Collect build artifacts info
        if: always()
        working-directory: telegram-ios
        run: |
          echo "=== All .app and .ipa files (with symlinks) ===" > $RUNNER_TEMP/found_files.txt
          find -L . -name "*.app" -type d 2>/dev/null | grep -v ".dSYM" >> $RUNNER_TEMP/found_files.txt || true
          find -L . -name "*.ipa" 2>/dev/null >> $RUNNER_TEMP/found_files.txt || true
          echo "=== bazel-bin top-level ===" >> $RUNNER_TEMP/found_files.txt
          ls -la bazel-bin/ 2>/dev/null >> $RUNNER_TEMP/found_files.txt || true
          echo "=== artifacts ===" >> $RUNNER_TEMP/found_files.txt
          find $RUNNER_TEMP/artifacts -type f 2>/dev/null >> $RUNNER_TEMP/found_files.txt || true
          cat $RUNNER_TEMP/found_files.txt

      - name: Package unsigned IPA
        run: |
          # 1. Проверяем --outputBuildArtifactsPath
          IPA=$(find $RUNNER_TEMP/artifacts -name "*.ipa" 2>/dev/null | head -1 || true)

          # 2. Ищем .ipa в bazel-bin (с -L для симлинков)
          if [ -z "$IPA" ]; then
            IPA=$(find -L telegram-ios/bazel-bin -name "*.ipa" 2>/dev/null | head -1 || true)
          fi

          if [ -n "$IPA" ]; then
            echo "Found IPA: $IPA"
            cp "$IPA" $RUNNER_TEMP/AorusGram-unsigned.ipa
          else
            # 3. Ищем .app — сначала в bazel-bin с симлинками, потом везде
            APP=$(find -L telegram-ios/bazel-bin -name "Telegram.app" -type d 2>/dev/null \
              | grep -v ".dSYM" | head -1 || true)

            if [ -z "$APP" ]; then
              APP=$(find -L telegram-ios/bazel-out -name "Telegram.app" -type d 2>/dev/null \
                | grep -v ".dSYM" | head -1 || true)
            fi

            if [ -z "$APP" ]; then
              APP=$(find -L telegram-ios -name "*.app" -type d 2>/dev/null \
                | grep -v ".dSYM" | head -1 || true)
            fi

            if [ -z "$APP" ]; then
              APP=$(find -L $RUNNER_TEMP/artifacts -name "*.app" -type d 2>/dev/null \
                | grep -v ".dSYM" | head -1 || true)
            fi

            if [ -z "$APP" ]; then
              echo "ERROR: No .app found anywhere."
              echo "=== bazel-bin contents ==="
              ls -la telegram-ios/bazel-bin/ 2>/dev/null || echo "(empty or missing)"
              echo "=== artifacts contents ==="
              find $RUNNER_TEMP/artifacts -type f 2>/dev/null || echo "(empty)"
              exit 1
            fi

            echo "Packaging $APP → IPA"
            mkdir -p $RUNNER_TEMP/Payload
            cp -r "$APP" $RUNNER_TEMP/Payload/AorusGram.app
            cd $RUNNER_TEMP && zip -qr AorusGram-unsigned.ipa Payload/
          fi

          ls -lh $RUNNER_TEMP/AorusGram-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AorusGram-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/AorusGram-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/build.log
          retention-days: 7
